<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags-list -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Hello, world!</title>
  </head>
  <body>
    <header class="p-3 bg-dark text-white">
      <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
          <a href="/" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none">
            <svg class="bi me-2" width="40" height="32" role="img" aria-label="Bootstrap"><use xlink:href="bootstrap-icons/bootstrap-icons.svg#bootstrap"></use></svg>
          </a>

          <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
            <li><a href="" routerLink="/tasks" class="nav-link nav-item px-2 text-secondary" routerLinkActive="text-white">Tasks</a></li>
            <li><a href="" routerLink="/tags" class="nav-link nav-item px-2 text-secondary" routerLinkActive="text-white">Tags</a></li>
            <li><a href="" routerLink="/projects" class="nav-link nav-item px-2 text-secondary" routerLinkActive="text-white">Projects</a></li>
          </ul>

          <form class="col-12 col-lg-auto mb-3 mb-lg-0 me-lg-3">
            <input type="search" class="form-control form-control-dark" placeholder="Search..." aria-label="Search">
          </form>

          @if (!loggedIn()) {
            <div class="text-end">
              <button type="button" class="btn btn-outline-light me-2" routerLink="/login">Login</button>
            </div>
          }
          @if (loggedIn()) {
            <div class="text-end">
              {{ currentUser()?.email }}
            </div>
          }
        </div>
      </div>
    </header>
    <div class = "container mt-3">
      <div class = "container mt-3">
        <router-outlet></router-outlet>
      </div>
    </div>
  </body>
</html>
