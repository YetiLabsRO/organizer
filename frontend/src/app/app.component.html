<div class="app-shell" [class.menu-open]="menuOpen()" [class.bare]="bare()">
  @if (!bare()) {
  <!-- Mobile top bar: brand + hamburger (hidden on desktop, where the sidebar is always shown). -->
  <header class="topbar d-lg-none">
    <button type="button" class="topbar-toggle" (click)="toggleMenu()"
            [attr.aria-expanded]="menuOpen()" aria-label="Toggle navigation">
      <svg class="bi" width="20" height="20" role="img" aria-hidden="true"><use xlink:href="bootstrap-icons/bootstrap-icons.svg#list"></use></svg>
    </button>
    <a class="topbar-brand" routerLink="/tasks/focus">Organizer</a>
  </header>

  <!-- Scrim behind the off-canvas sidebar on mobile. -->
  <div class="scrim" (click)="toggleMenu()" aria-hidden="true"></div>

  <aside class="sidebar">
    <a class="sidebar-brand" routerLink="/tasks/focus">
      <span class="brand-title">Organizer</span>
      <span class="brand-sub">MISSION CONTROL</span>
    </a>

    <button type="button" class="sidebar-new-task" (click)="drawer.openDrawer()">
      <svg class="bi" width="16" height="16" role="img" aria-hidden="true"><use xlink:href="bootstrap-icons/bootstrap-icons.svg#plus-lg"></use></svg>
      <span>New Task</span>
    </button>

    <nav class="sidebar-nav" aria-label="Primary">
      <a class="nav-link" routerLink="/tasks/focus" routerLinkActive="active">
        <svg class="bi" width="17" height="17" role="img" aria-hidden="true"><use xlink:href="bootstrap-icons/bootstrap-icons.svg#bullseye"></use></svg>
        <span>Focus</span>
      </a>
      <a class="nav-link" routerLink="/tasks" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <svg class="bi" width="17" height="17" role="img" aria-hidden="true"><use xlink:href="bootstrap-icons/bootstrap-icons.svg#list-check"></use></svg>
        <span>Tasks</span>
      </a>
      <a class="nav-link" routerLink="/tasks/stats" routerLinkActive="active">
        <svg class="bi" width="17" height="17" role="img" aria-hidden="true"><use xlink:href="bootstrap-icons/bootstrap-icons.svg#bar-chart"></use></svg>
        <span>Stats</span>
      </a>
      <a class="nav-link" routerLink="/tags" routerLinkActive="active">
        <svg class="bi" width="17" height="17" role="img" aria-hidden="true"><use xlink:href="bootstrap-icons/bootstrap-icons.svg#tags"></use></svg>
        <span>Tags</span>
      </a>
      <a class="nav-link" routerLink="/projects" routerLinkActive="active">
        <svg class="bi" width="17" height="17" role="img" aria-hidden="true"><use xlink:href="bootstrap-icons/bootstrap-icons.svg#folder"></use></svg>
        <span>Projects</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      @if (!loggedIn()) {
        <a class="footer-login" routerLink="/login">
          <svg class="bi" width="16" height="16" role="img" aria-hidden="true"><use xlink:href="bootstrap-icons/bootstrap-icons.svg#box-arrow-in-right"></use></svg>
          <span>Login</span>
        </a>
      } @else {
        <div class="footer-user" [title]="currentUser()?.email">
          <span class="footer-avatar" aria-hidden="true">{{ (currentUser()?.email || '?')[0] }}</span>
          <span class="footer-email text-truncate">{{ currentUser()?.email }}</span>
        </div>
      }
    </div>
  </aside>
  }

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>

<!-- Single app-wide Create Task drawer, opened from the sidebar or a list FAB. -->
<app-task-create-drawer [open]="drawer.open()" (openChange)="drawer.open.set($event)"
                        (created)="drawer.notifyCreated($event)" />
