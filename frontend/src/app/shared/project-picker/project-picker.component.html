<div class="position-relative">
  <div class="input-group">
    <span class="input-group-text">&#64;</span>
    <input #input type="text" class="form-control"
           [value]="text()" (input)="onInput($event)" (keydown)="onKeydown($event)" (blur)="onBlur()"
           placeholder="No project" autocomplete="off">
    @if (projectId() != null) {
      <button type="button" class="btn btn-outline-secondary"
              (mousedown)="$event.preventDefault()" (click)="clear()" aria-label="Clear project">&times;</button>
    }
  </div>

  @if (dropdownOpen()) {
    <app-suggestion-list class="picker-dropdown"
      [items]="suggestions()" [activeIndex]="activeIndex()"
      (pick)="select($event)" (activeChange)="activeIndex.set($event)" />
  }
</div>
