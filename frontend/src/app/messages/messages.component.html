@if (messageService.messages().length) {
  @for (message of messageService.messages() | slice:0:3; track $index) {
    <div class="alert alert-primary alert-dismissible fade show" role="alert">
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close" (click)="messageService.drop($index)"></button>
    </div>
  }
}
