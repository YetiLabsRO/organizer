<div class="quick-add position-relative">
  <div class="input-group">
    <input
      #input
      type="text"
      class="form-control"
      [value]="text()"
      (input)="onInput($event)"
      (keydown)="onKeydown($event)"
      (blur)="closeDropdown()"
      placeholder="Add a task…  #tag  @project  (ddl: next friday)  !!"
      title="#tag and @project attach existing ones (unknown stay as text) · end with !! for high priority or ?? for low · (ddl: 2026-07-20 | tomorrow | next friday | two weeks from now) sets a deadline"
      aria-label="Add a task"
      autocomplete="off"
    >
    <button class="btn btn-primary" type="button" (mousedown)="$event.preventDefault()" (click)="submit()">Add</button>
  </div>

  @if (dropdownOpen()) {
    <app-suggestion-list
      class="quick-add-dropdown"
      [items]="suggestions()"
      [activeIndex]="activeIndex()"
      (pick)="select($event)"
      (activeChange)="activeIndex.set($event)"
    />
  }
</div>
