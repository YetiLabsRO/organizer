name: deploy-frontend

# Builds the Angular SPA and deploys the static bundle to the web root on push to
# `develop`. Inspired by the weinland UI deploy workflow.
#
# Required GitHub config (Settings → Secrets and variables → Actions):
#   Variables: SSH_USER, SSH_HOST, SSH_PORT, FRONTEND_WEB_ROOT (e.g. /var/www/organizer)
#   Secrets:   SSH_KEY (private key authorised on the server)

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yaml'
  pull_request:
    branches: [develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yaml'

jobs:
  test_and_build:
    name: Test, build and deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests
        working-directory: frontend
        run: npm test

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      # --- Deploy (only on push to develop / manual dispatch) ---
      - name: Configure SSH
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
        env:
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/production.key
          chmod 600 ~/.ssh/production.key
          cat >>~/.ssh/config <<END
          Host production
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/production.key
            StrictHostKeyChecking no
          END

      - name: Bundle dist
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
        run: tar czf organizer-dist.tar.gz -C frontend/dist/organizer-frontend/browser .

      - name: Copy bundle to server
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
        run: 'scp organizer-dist.tar.gz production:'

      - name: Unpack into web root
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
        run: |
          ssh production '
            set -euo pipefail
            WEB_ROOT="${{ vars.FRONTEND_WEB_ROOT }}"
            sudo mkdir -p "$WEB_ROOT"
            sudo rm -rf "${WEB_ROOT:?}/"*
            sudo tar xzf organizer-dist.tar.gz -C "$WEB_ROOT"
            rm -f organizer-dist.tar.gz
          '
